<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ToDo App{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i class="bi bi-check2-circle"></i>
                    <span>ToDo App</span>
                </div>
                <button class="btn-close-sidebar d-lg-none" id="closeSidebar">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>

            <div class="sidebar-body">
                <div class="theme-switch-wrapper">
                    <i class="bi bi-sun-fill"></i>
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="themeToggle">
                    </div>
                    <i class="bi bi-moon-fill"></i>
                </div>

                <div class="sidebar-section">
                    <h6 class="sidebar-label">Filtros</h6>
                    <div class="filter-group" id="statusFilters">
                        <button class="filter-btn active" data-filter="status" data-value="all">
                            <i class="bi bi-list-task"></i> Todas
                        </button>
                        <button class="filter-btn" data-filter="status" data-value="pending">
                            <i class="bi bi-circle"></i> Pendientes
                        </button>
                        <button class="filter-btn" data-filter="status" data-value="completed">
                            <i class="bi bi-check-circle"></i> Completadas
                        </button>
                    </div>
                </div>

                <div class="sidebar-section">
                    <h6 class="sidebar-label">Prioridad</h6>
                    <div class="filter-group" id="priorityFilters">
                        <button class="filter-btn active" data-filter="priority" data-value="all">
                            Todas
                        </button>
                        <button class="filter-btn priority-alta" data-filter="priority" data-value="alta">
                            <span class="priority-dot high"></span> Alta
                        </button>
                        <button class="filter-btn priority-media" data-filter="priority" data-value="media">
                            <span class="priority-dot medium"></span> Media
                        </button>
                        <button class="filter-btn priority-baja" data-filter="priority" data-value="baja">
                            <span class="priority-dot low"></span> Baja
                        </button>
                    </div>
                </div>

                <div class="sidebar-section">
                    <h6 class="sidebar-label">Categoría</h6>
                    <div class="filter-group" id="categoryFilters">
                        <button class="filter-btn active" data-filter="category" data-value="all">
                            Todas
                        </button>
                        <button class="filter-btn" data-filter="category" data-value="trabajo">
                            <i class="bi bi-briefcase"></i> Trabajo
                        </button>
                        <button class="filter-btn" data-filter="category" data-value="universidad">
                            <i class="bi bi-book"></i> Universidad
                        </button>
                        <button class="filter-btn" data-filter="category" data-value="personal">
                            <i class="bi bi-person"></i> Personal
                        </button>
                        <button class="filter-btn" data-filter="category" data-value="compras">
                            <i class="bi bi-cart"></i> Compras
                        </button>
                        <button class="filter-btn" data-filter="category" data-value="salud">
                            <i class="bi bi-heart-pulse"></i> Salud
                        </button>
                        <button class="filter-btn" data-filter="category" data-value="otras">
                            <i class="bi bi-three-dots"></i> Otras
                        </button>
                    </div>
                </div>

                <div class="sidebar-section">
                    <h6 class="sidebar-label">Ordenar por</h6>
                    <select class="form-select form-select-sm" id="sortSelect">
                        <option value="created_at">Fecha de creación</option>
                        <option value="priority">Prioridad</option>
                        <option value="due_date">Fecha límite</option>
                        <option value="alphabetical">Alfabético</option>
                    </select>
                </div>
            </div>

            <div class="sidebar-footer">
                <small>&copy; 2026 ToDo App</small>
            </div>
        </aside>

        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <main class="main-content" id="mainContent">
            {% block content %}{% endblock %}
        </main>
    </div>

    <div class="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
